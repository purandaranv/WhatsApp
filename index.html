<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Open a WhatsApp chat instantly with a phone number and country code." />
    <title>WhatsApp Direct Chat</title>
    <style>
      :root {
        --bg: #f3f7fb;
        --bg-accent: #eafaf0;
        --panel: rgba(255, 255, 255, 0.9);
        --panel-strong: #ffffff;
        --panel-soft: #f5f8fb;
        --line: rgba(17, 27, 33, 0.08);
        --line-strong: rgba(17, 27, 33, 0.12);
        --primary: #25d366;
        --primary-strong: #1ea95b;
        --secondary: #075e54;
        --text: #111b21;
        --muted: #667781;
        --danger: #d93025;
        --danger-bg: #fff1ee;
        --shadow: 0 24px 60px rgba(17, 27, 33, 0.12);
      }

      body.dark {
        --bg: #06171d;
        --bg-accent: #0d201f;
        --panel: rgba(17, 27, 33, 0.82);
        --panel-strong: #111b21;
        --panel-soft: #172229;
        --line: rgba(255, 255, 255, 0.08);
        --line-strong: rgba(255, 255, 255, 0.14);
        --primary: #25d366;
        --primary-strong: #1ea95b;
        --secondary: #88e8ad;
        --text: #ecf4f9;
        --muted: #b7c5cf;
        --danger: #ff8d8d;
        --danger-bg: rgba(255, 122, 122, 0.12);
        --shadow: 0 30px 70px rgba(0, 0, 0, 0.35);
      }

      * {
        box-sizing: border-box;
      }

      html, body {
        margin: 0;
        min-height: 100%;
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background: radial-gradient(circle at top left, rgba(37, 211, 102, 0.08), transparent 25%), linear-gradient(135deg, var(--bg) 0%, var(--bg-accent) 100%);
        color: var(--text);
        transition: background 0.25s ease, color 0.25s ease;
      }

      body {
        display: grid;
        place-items: center;
        padding: 24px;
      }

      button, input, select {
        font: inherit;
      }

      .chat-shell {
        width: min(100%, 420px);
      }

      .chat-card {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 30px;
        box-shadow: var(--shadow);
        backdrop-filter: blur(14px);
        overflow: hidden;
      }

      .chat-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 18px 20px 16px;
        background: linear-gradient(180deg, rgba(37, 211, 102, 0.12), rgba(37, 211, 102, 0.03));
        border-bottom: 1px solid var(--line);
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        font-weight: 700;
        letter-spacing: -0.02em;
      }

      .brand-mark {
        width: 38px;
        height: 38px;
        border-radius: 12px;
        display: grid;
        place-items: center;
        background: linear-gradient(135deg, #1ae279, var(--primary));
        color: white;
        font-size: 1.2rem;
        box-shadow: 0 10px 18px rgba(37, 211, 102, 0.22);
      }

      .theme-toggle {
        border: 1px solid var(--line-strong);
        background: var(--panel-strong);
        color: var(--text);
        border-radius: 999px;
        padding: 0.58rem 0.9rem;
        font-weight: 600;
        cursor: pointer;
      }

      .chat-body {
        padding: 22px 20px 20px;
      }

      .title {
        margin: 0 0 6px;
        font-size: clamp(1.7rem, 4vw, 2.2rem);
        letter-spacing: -0.05em;
        line-height: 1.05;
      }

      .subtitle {
        margin: 0 0 18px;
        color: var(--muted);
        font-size: 0.96rem;
        line-height: 1.6;
      }

      form {
        display: grid;
        gap: 1rem;
      }

      .field {
        display: grid;
        gap: 0.45rem;
      }

      label {
        font-size: 0.76rem;
        font-weight: 700;
        letter-spacing: 0.02em;
        color: var(--muted);
        text-transform: uppercase;
      }

      .input-wrap {
        display: flex;
        align-items: center;
        border: 1px solid var(--line);
        border-radius: 16px;
        background: var(--panel-soft);
        padding: 0 0.8rem;
        transition: border-color 0.2s ease, box-shadow 0.2s ease;
      }

      .input-wrap:focus-within {
        border-color: rgba(37, 211, 102, 0.6);
        box-shadow: 0 0 0 4px rgba(37, 211, 102, 0.12);
      }

      select,
      input {
        width: 100%;
        background: transparent;
        border: none;
        outline: none;
        color: var(--text);
        padding: 0.9rem 0.5rem;
      }

      select {
        appearance: none;
        cursor: pointer;
      }

      input::placeholder {
        color: var(--muted);
      }

      .error {
        display: none;
        min-height: 1.2rem;
        padding: 0.7rem 0.8rem;
        border-radius: 12px;
        background: var(--danger-bg);
        border: 1px solid rgba(217, 48, 37, 0.16);
        color: var(--danger);
        font-size: 0.88rem;
        line-height: 1.5;
      }

      .button-primary {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border: none;
        border-radius: 16px;
        background: linear-gradient(135deg, var(--primary), var(--primary-strong));
        color: white;
        font-weight: 700;
        padding: 0.95rem 1.2rem;
        cursor: pointer;
        box-shadow: 0 14px 28px rgba(37, 211, 102, 0.18);
        transition: transform 0.2s ease, filter 0.2s ease;
      }

      .button-primary:hover {
        transform: translateY(-1px);
        filter: brightness(1.02);
      }

      @media (max-width: 480px) {
        body {
          padding: 16px;
        }

        .chat-body {
          padding: 18px 16px 18px;
        }
      }
    </style>
  </head>
  <body>
    <main class="chat-shell" aria-label="WhatsApp direct chat">
      <div class="chat-card">
        <div class="chat-header">
          <div class="brand" aria-label="WhatsApp Direct brand">
            <div class="brand-mark" aria-hidden="true">✆</div>
            <span>WhatsApp Direct</span>
          </div>
          <button id="themeToggle" class="theme-toggle" type="button" aria-label="Toggle color mode">Dark</button>
        </div>

        <div class="chat-body">
          <h1 class="title">Open chat</h1>
          <p class="subtitle">Enter the country and number to launch the contact instantly.</p>

          <form id="waForm" novalidate>
            <div class="field">
              <label for="countryCode">Country</label>
              <div class="input-wrap">
                <select id="countryCode" aria-label="Select country code">
                  <option value="1">United States (+1)</option>
                  <option value="44">United Kingdom (+44)</option>
                  <option value="61">Australia (+61)</option>
                  <option value="91" selected>India (+91)</option>
                  <option value="971">UAE (+971)</option>
                  <option value="966">Saudi Arabia (+966)</option>
                  <option value="92">Pakistan (+92)</option>
                  <option value="880">Bangladesh (+880)</option>
                  <option value="234">Nigeria (+234)</option>
                  <option value="27">South Africa (+27)</option>
                  <option value="55">Brazil (+55)</option>
                  <option value="52">Mexico (+52)</option>
                  <option value="81">Japan (+81)</option>
                  <option value="65">Singapore (+65)</option>
                  <option value="33">France (+33)</option>
                </select>
              </div>
            </div>

            <div class="field">
              <label for="phone">Mobile number</label>
              <div class="input-wrap">
                <input id="phone" type="tel" inputmode="numeric" autocomplete="tel" placeholder="e.g. 9876543210" aria-label="Phone number" />
              </div>
            </div>

            <div id="errorMsg" class="error" role="alert" aria-live="polite">Please enter a valid mobile number.</div>

            <button class="button-primary" type="submit">Open WhatsApp</button>
          </form>
        </div>
      </div>
    </main>

    <script>
      const form = document.getElementById('waForm');
      const phoneInput = document.getElementById('phone');
      const countryCode = document.getElementById('countryCode');
      const errorMsg = document.getElementById('errorMsg');
      const themeToggle = document.getElementById('themeToggle');

      function initializeTheme() {
        const saved = localStorage.getItem('whatsapp-theme');
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        const darkMode = saved ? saved === 'dark' : prefersDark;

        if (darkMode) {
          document.body.classList.add('dark');
          themeToggle.textContent = 'Light';
        } else {
          themeToggle.textContent = 'Dark';
        }
      }

      function sanitizePhone(value) {
        return value.replace(/\D/g, '').replace(/^0+/, '');
      }

      function showError(show, message = 'Please enter a valid mobile number.') {
        errorMsg.style.display = show ? 'block' : 'none';
        errorMsg.textContent = message;
        phoneInput.setAttribute('aria-invalid', String(show));
      }

      phoneInput.addEventListener('input', () => {
        phoneInput.value = phoneInput.value.replace(/[^\d+\s()-]/g, '');
        showError(false);
      });

      themeToggle.addEventListener('click', () => {
        const isDark = document.body.classList.toggle('dark');
        localStorage.setItem('whatsapp-theme', isDark ? 'dark' : 'light');
        themeToggle.textContent = isDark ? 'Light' : 'Dark';
      });

      form.addEventListener('submit', function (event) {
        event.preventDefault();

        const countryPrefix = countryCode.value.replace(/\D/g, '');
        const userNumber = sanitizePhone(phoneInput.value);

        if (!userNumber) {
          showError(true);
          phoneInput.focus();
          return;
        }

        // Accept numbers entered with or without the selected country prefix.
        const finalNumber = userNumber.startsWith(countryPrefix)
          ? userNumber
          : countryPrefix + userNumber;

        if (!/^\d{7,15}$/.test(finalNumber)) {
          showError(true);
          phoneInput.focus();
          return;
        }

        showError(false);
        window.location.href = `https://api.whatsapp.com/send?phone=${finalNumber}`;
      });

      initializeTheme();
    </script>
  </body>
</html>
